<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PPA Professional Profile Assessment Language Selection</title>

<style>
body {
    font-family: Segoe UI, Arial, sans-serif;
    background: #f4f6f8;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    text-align: center;
    max-width: 500px;
    width: 90%;
}

h1 {
    margin-top: 0;
    color: #333;
}

p {
    color: #666;
    margin-bottom: 30px;
}

.lang-btn {
    display: block;
    width: 100%;
    padding: 18px;
    margin: 12px 0;
    text-decoration: none;
    font-size: 20px;
    font-weight: 600;
    border-radius: 10px;
    color: white;
    transition: transform 0.15s ease;
    box-sizing: border-box;
}

.lang-btn:hover {
    transform: scale(1.02);
}

.en {
    background: #0078d4;
}

.de {
    background: #d83b01;
}

.footer {
    margin-top: 25px;
    font-size: 12px;
    color: #888;
}
</style>

</head>
<body>

<div class="card">

    <h1>PPA Questionnaire</h1>

    <p>
        Please select your language<br>
        Bitte wählen Sie Ihre Sprache
    </p>

    <a class="lang-btn en"
       href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAEbyDM-estUQTM5OUxZUFBXUVlTODA1TjY1UjlENDlEVy4u"
       target="_blank">
       🇬🇧 English
    </a>

    <a class="lang-btn de"
       href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=DQSIkWdsW0yxEjajBLZtrQAAAAAAAAAAAAEbyDM-estUOENSOFBEOFZXNENQS1NISFc0N00wRUVWTC4u"
       target="_blank">
       🇩🇪 Deutsch
    </a>

    <div class="footer">
        PPA Assessment
    </div>

</div>

</body>
</html>
